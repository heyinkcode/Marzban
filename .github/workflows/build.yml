name: Mr.shaw fork image

on:
  push:
    branches:
      - master
    tags:
      - mrshaw-v*
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check backend
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify real pinned Xray relay on Linux
        run: |
          mkdir -p "$RUNNER_TEMP/relay-xray"
          curl --fail --location --retry 2 --max-time 120 https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip -o "$RUNNER_TEMP/relay-xray/xray.zip"
          unzip -q "$RUNNER_TEMP/relay-xray/xray.zip" -d "$RUNNER_TEMP/relay-xray"
          chmod +x "$RUNNER_TEMP/relay-xray/xray"
          MR_SHAW_RELAY_TEST_XRAY="$RUNNER_TEMP/relay-xray/xray" python -m unittest discover -s tests -p 'test_node_relay_process.py' -v
          MR_SHAW_RELAY_TEST_XRAY="$RUNNER_TEMP/relay-xray/xray" python -m unittest discover -s tests -p 'test_main_egress*.py' -v
          MR_SHAW_RELAY_TEST_XRAY="$RUNNER_TEMP/relay-xray/xray" python -m unittest discover -s tests -p 'test_dedicated_access_runtime.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci --ignore-scripts
      - name: Check and build dashboard
        working-directory: app/dashboard
        env:
          VITE_BASE_API: /api/
        run: |
          npm run test:locales
          npm exec tsc -- --noEmit
          npm exec vite -- build --outDir build --assetsDir statics
          cp build/index.html build/404.html
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@v3
      - name: Build isolated amd64 migration-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: marzban-release-test:local
          cache-from: type=gha,scope=marzban-release
          cache-to: type=gha,mode=max,scope=marzban-release
          build-args: |
            XRAY_CORE_VERSION=v26.3.27
      - name: Verify container migration and fail-closed startup
        run: |
          docker run --rm --network none --entrypoint python marzban-release-test:local tools/verify_usage_continuity_release.py --xray /usr/local/bin/xray
          docker run --rm --network none --entrypoint python marzban-release-test:local tools/verify_dedicated_access_release.py --xray /usr/local/bin/xray
          set +e
          timeout 30s docker run --name marzban-failed-migration --network none -e SQLALCHEMY_DATABASE_URL=sqlite:////missing-directory/ledger.db marzban-release-test:local > "$RUNNER_TEMP/migration-failure.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/migration-failure.log"
          test "$result" = 1
          ! grep -q 'Application startup complete' "$RUNNER_TEMP/migration-failure.log"
      - name: Authenticate to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify formal Xray core pin
        if: github.event_name != 'pull_request'
        run: |
          test "$(grep -m1 '^ARG XRAY_CORE_VERSION=' Dockerfile | cut -d= -f2 | tr -d '\r')" = "v26.3.27"
          test "$(grep -m1 'XRAY_CORE_VERSION=v26.3.27' .github/workflows/build.yml)" != ""
          ! grep -n -E 'XRAY_CORE_VERSION=v(25|26\.9\.9)' Dockerfile
      - name: Image tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/heyinkcode/marzban
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha
            type=ref,event=tag
      - name: Build and publish fork image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=marzban-release
          cache-to: type=gha,mode=max,scope=marzban-release
          build-args: |
            XRAY_CORE_VERSION=v26.3.27
